# Server Configuration
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:androidapp}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.web.resources.add-mappings=false

# Logging Configuration
debug=${DEBUG_MODE:false}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING:INFO}
logging.level.com.example=${LOG_LEVEL_APP:DEBUG}

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

#setup sepay
sepay.api-key=${SEPAY_API_KEY:JYCMVDKNYLSSTPFNGBU26EY1WH9IUV1ENFNLWO4QCVGWB5F8EMDJGZWM2ZRGHBHR}

